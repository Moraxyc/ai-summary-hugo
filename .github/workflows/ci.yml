name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check uv.lock is in sync with pyproject.toml
        run: nix develop --command uv lock --check

      - name: Run flake checks
        run: nix flake check -L

      - name: Build package
        run: nix build -L
